<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Interruption outcomes</title><desc id="desc">Before checkpoint publication use the previous checkpoint; during publication checksum validity determines old or new; after successful flush use the new checkpoint. Diagram is not hardware power-loss certification.</desc><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#142c39}.label{font-size:16px;letter-spacing:1.8px;font-weight:700}.title{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#526672}.mono{font-family:monospace;font-size:16px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526672" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="620" rx="20" fill="#f3f5f2" stroke="none"/><text x="42" y="49" class="label">02 / INTERRUPTION MODEL</text><text x="42" y="94" class="title">중단 시점별 체크포인트</text><text x="42" y="132" class="body">전제: 지원 APFS 형식 · 정상적인 장치 flush  /  구분: 설계 모식도</text><rect x="36" y="170" width="1128" height="104" rx="14" fill="#ffffff" stroke="#c9d5d9"/><text x="61" y="213" class="title">01</text><text x="128" y="210" class="title">새 NX 공개 전</text><text x="128" y="246" class="small">새 데이터·할당표는 별도 블록에 기록</text><path d="M600 222L674 222" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="699" y="189" width="439" height="65" rx="14" fill="#e6edf9" stroke="none"/><text x="725" y="229" class="title">이전 체크포인트</text><rect x="36" y="294" width="1128" height="104" rx="14" fill="#ffffff" stroke="#c9d5d9"/><text x="61" y="337" class="title">02</text><text x="128" y="334" class="title">새 NX 기록 중</text><text x="128" y="370" class="small">부분 기록은 checksum으로 판별</text><path d="M600 346L674 346" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="699" y="313" width="439" height="65" rx="14" fill="#fbecd1" stroke="none"/><text x="725" y="353" class="title">이전 또는 새 체크포인트</text><rect x="36" y="418" width="1128" height="104" rx="14" fill="#ffffff" stroke="#c9d5d9"/><text x="61" y="461" class="title">03</text><text x="128" y="458" class="title">새 NX flush 완료</text><text x="128" y="494" class="small">참조 블록과 새 체크포인트 반영</text><path d="M600 470L674 470" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="699" y="437" width="439" height="65" rx="14" fill="#e0f1e9" stroke="none"/><text x="725" y="477" class="title">새 체크포인트</text><text x="42" y="571" class="small">검증: 318개 I/O 경계 + 112개 부분 NX 기록 = 430개 이미지 · DGX 복구 없이 Mac 검사</text></svg>