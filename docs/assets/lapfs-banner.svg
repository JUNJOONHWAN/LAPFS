<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">LAPFS — buffered APFS access for Linux ARM64</title><desc id="desc">Experimental public beta. Three steps: durable queue, verified commit, explicit recovery.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#172e3d"/></linearGradient></defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="54" y="59" font-size="14" letter-spacing="3" fill="#71dbca">LINUX ARM64 · DGX SPARK</text>
<text x="50" y="132" font-size="66" font-weight="700" fill="#f3f7ff">LAPFS</text>
<text x="55" y="169" font-size="22" fill="#c3d1e4">APFS access with bounded, durable write buffering.</text>
<rect x="896" y="43" width="250" height="36" rx="18" fill="#403a27" stroke="#ad8750"/><text x="1021" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#ffcf7c">EXPERIMENTAL PUBLIC BETA</text>
<g transform="translate(54 211)"><rect width="338" height="98" rx="12" fill="#1b3548" stroke="#315565"/><text x="20" y="32" fill="#75dfcc" font-size="13" letter-spacing="2">01 / BUFFER</text><text x="20" y="66" fill="#edf7ff" font-size="22">4 MiB durable queue</text></g>
<g transform="translate(430 211)"><rect width="338" height="98" rx="12" fill="#1b3548" stroke="#315565"/><text x="20" y="32" fill="#75dfcc" font-size="13" letter-spacing="2">02 / COMMIT</text><text x="20" y="66" fill="#edf7ff" font-size="22">Journal · flush · verify</text></g>
<g transform="translate(806 211)"><rect width="338" height="98" rx="12" fill="#1b3548" stroke="#315565"/><text x="20" y="32" fill="#75dfcc" font-size="13" letter-spacing="2">03 / RECOVER</text><text x="20" y="66" fill="#edf7ff" font-size="22">Retain · resume · replay</text></g>
<path d="M398 260h23m-7-6 7 6-7 6M774 260h23m-7-6 7 6-7 6" fill="none" stroke="#71dbca" stroke-width="2"/>
</g></svg>
