<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">LAPFS beta.7</title><desc id="desc">Linux ARM64 APFS reader and experimental CoW writer. 430 interrupted images, 296 Rust tests and three Mac/Linux cycles passed. Physical power cuts are unqualified.</desc><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#142c39}.label{font-size:16px;letter-spacing:1.8px;font-weight:700}.title{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#526672}.mono{font-family:monospace;font-size:16px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526672" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="460" rx="24" fill="#112b38" stroke="none"/><text x="52" y="56" class="label" style="fill:#99d9c9">LINUX ARM64  /  APFS  /  PUBLIC BETA 07</text><text x="48" y="155" style="font-size:96px;font-weight:700;letter-spacing:-5px;fill:#f5f5ec">LAPFS</text><text x="54" y="207" class="title" style="fill:#f5f5ec">새 체크포인트를 쓰는 동안,</text><text x="54" y="247" class="title" style="fill:#f5f5ec">이전 상태를 보존합니다.</text><text x="54" y="296" class="body" style="fill:#bcd3da">영구 입력 큐 · 데이터/할당표 CoW · 정상 분리</text><text x="54" y="366" class="title" style="fill:#a9e2cb">430</text><text x="54" y="397" class="small" style="fill:#c5d4da">Mac 중단 이미지</text><text x="273" y="366" class="title" style="fill:#a9e2cb">296</text><text x="273" y="397" class="small" style="fill:#c5d4da">Rust 시험</text><text x="462" y="366" class="title" style="fill:#a9e2cb">3</text><text x="462" y="397" class="small" style="fill:#c5d4da">Mac ↔ Linux 왕복</text><rect x="764" y="102" width="373" height="254" rx="14" fill="#1b3a48" stroke="#456471"/><text x="790" y="141" class="label" style="fill:#bcd3da">CHECKPOINT PUBLICATION</text><rect x="790" y="165" width="136" height="67" rx="14" fill="#eff4f0" stroke="none"/><text x="810" y="205" class="body">이전 상태</text><rect x="970" y="165" width="140" height="67" rx="14" fill="#a9e2cb" stroke="none"/><text x="990" y="205" class="body">새 블록</text><path d="M938 198L955 198" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="790" y="275" class="small" style="fill:#deebe9">참조 블록 flush → 새 NX → flush</text><text x="790" y="311" class="small" style="fill:#bcd3da">새 NX 공개 전: 이전 체크포인트 유지</text><text x="790" y="402" class="small" style="fill:#d2dce0">시험 결과는 물리 전원 차단 인증이 아닙니다.</text></svg>