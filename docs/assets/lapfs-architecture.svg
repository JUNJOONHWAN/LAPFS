<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">LAPFS write path</title><desc id="desc">DGX FUSE groups input in an internal log; fsync and close persist it before APFS mutation. USB APFS receives CoW data and allocator blocks; flush dependencies, publish ring NX, flush again. Write acknowledgement does not mean USB durability.</desc><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#142c39}.label{font-size:16px;letter-spacing:1.8px;font-weight:700}.title{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#526672}.mono{font-family:monospace;font-size:16px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526672" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1200" height="640" rx="20" fill="#f3f5f2" stroke="none"/><text x="42" y="49" class="label">01 / WRITE PATH</text><text x="42" y="94" class="title">저장 위치</text><text x="42" y="131" class="body">DGX: 입력 큐·복구 기록  /  USB: 데이터·할당표·체크포인트</text><rect x="36" y="164" width="540" height="356" rx="14" fill="#ffffff" stroke="#c9d5d9"/><rect x="608" y="164" width="556" height="356" rx="14" fill="#ffffff" stroke="#c9d5d9"/><text x="62" y="205" class="label">DGX / INTERNAL EXT4 · XFS</text><text x="634" y="205" class="label">USB / APFS</text><rect x="62" y="236" width="488" height="88" rx="14" fill="#eef3f6" stroke="none"/><text x="83" y="271" class="title">1  파일 I/O · FUSE</text><text x="83" y="303" class="small">cp · rsync · 일반 파일 읽기/쓰기</text><rect x="62" y="351" width="488" height="88" rx="14" fill="#eef3f6" stroke="none"/><text x="83" y="386" class="title">2  입력 로그 + undo/redo</text><text x="83" y="418" class="small">기본 입력 큐 4 MiB · 배치 복구 상한 32 MiB</text><path d="M306 329L306 343" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="83" y="481" class="small">write() 성공: 버퍼 수락 · 영구 저장 미보장</text><rect x="634" y="236" width="504" height="88" rx="14" fill="#e0f1e9" stroke="none"/><text x="656" y="271" class="title">3  새 블록에 CoW 기록</text><text x="656" y="303" class="small">파일 데이터 · catalog · extent · 할당표</text><rect x="634" y="351" width="504" height="88" rx="14" fill="#e6edf9" stroke="none"/><text x="656" y="386" class="title">4  체크포인트 공개</text><text x="656" y="418" class="small">참조 블록 flush → ring NX 기록 → flush</text><path d="M884 329L884 343" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M555 394L626 278" stroke="#526672" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="655" y="481" class="small">fsync/close 반영 성공: 장치 flush · 재검증</text><rect x="36" y="544" width="1128" height="64" rx="14" fill="#112b38" stroke="none"/><text x="58" y="584" class="body" style="fill:#f5f5ec">반영 범위: 변경 블록  /  미반영 입력: DGX 내부 큐  /  전체 디스크 복제: 불필요</text></svg>